<div class="page-header">
  <div class="page-title">
    <div class="app-hero__eyebrow">{{ page_eyebrow | default('Sala de situación') }}</div>
    <h1>{{ page_title }}</h1>
    <p>{{ page_subtitle }}</p>
    {% if page_period %}
    <div class="page-title__meta">{{ page_period }}</div>
    {% endif %}
  </div>
  <div class="shell-actions">
    <a href="{{ url_for('base_blueprint.index') }}" class="shell-link shell-link--muted">Inicio</a>
    <a href="{{ url_for('appointments_blueprint.seleccionar_consultorio') }}" class="shell-link shell-link--muted">Turnos</a>
    <a href="{{ url_for('dashboard_blueprint.dashboard_indicators') }}" class="shell-link shell-link--primary">Dashboard</a>
  </div>
</div>
