<!-- layouts/partials/footer.html -->
<div class="footer-container">
  <div class="footer-content">
    <span class="footer-copyright">Gestión salud - Dashboard</span>

    <div class="footer-links-with-qr">
      <div class="link-with-qr">
        <a
          href="http://ingenieria.uner.edu.ar/grupos/salud_publica/"
          target="_blank"
          class="footer-link"
          >¿Quienes somos?</a
        >
        <div class="qr-container" id="qr-quienes-somos">
          <div class="qr-placeholder">QR</div>
        </div>
      </div>

      <div class="link-with-qr">
        <a
          href="https://gitlab.com/gnuhealth_fiuner"
          target="_blank"
          class="footer-link"
          >Repositorio</a
        >
        <div class="qr-container" id="qr-repositorio">
          <div class="qr-placeholder">QR</div>
        </div>
      </div>

      <div class="link-with-qr">
        <a
          href="mailto:saludpublica@ingenieria.uner.edu.ar"
          target="_blank"
          class="footer-link"
          >Contacto</a
        >
        <div class="qr-container" id="qr-contacto">
          <div class="qr-placeholder">QR</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script>
  function generateQRCode(elementId, text) {
    const container = document.getElementById(elementId);
    if (!container) return;

    try {
      container.innerHTML = "";
      const typeNumber = 0;
      const errorCorrectionLevel = "L";
      const qr = qrcode(typeNumber, errorCorrectionLevel);
      qr.addData(text);
      qr.make();

      const canvas = document.createElement("canvas");
      const size = 42;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      const moduleCount = qr.getModuleCount();
      const tileSize = size / moduleCount;

      for (let row = 0; row < moduleCount; row++) {
        for (let col = 0; col < moduleCount; col++) {
          ctx.fillStyle = qr.isDark(row, col) ? "#1a1f36" : "#ffffff";
          ctx.fillRect(col * tileSize, row * tileSize, tileSize, tileSize);
        }
      }

      container.appendChild(canvas);
      canvas.style.cursor = "pointer";
      canvas.addEventListener("click", function () {
        window.open(text, "_blank");
      });
    } catch (error) {
      console.error("Error generando QR:", error);
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    const qrConfig = [
      {
        id: "qr-quienes-somos",
        url: "http://ingenieria.uner.edu.ar/grupos/salud_publica/",
      },
      { id: "qr-repositorio", url: "https://gitlab.com/gnuhealth_fiuner" },
      { id: "qr-contacto", url: "mailto:saludpublica@ingenieria.uner.edu.ar" },
    ];

    qrConfig.forEach((config) => {
      generateQRCode(config.id, config.url);
    });
  });

  function checkLibraryLoaded() {
    setTimeout(() => {
      if (typeof qrcode === "undefined") {
        const containers = document.querySelectorAll(".qr-container");
        containers.forEach((container) => {
          container.innerHTML = '<div class="qr-placeholder">QR</div>';
        });
      }
    }, 2000);
  }

  checkLibraryLoaded();
</script>
